spring.application.name=address-book-backend
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}

spring.datasource.url=${ADDRESSBOOK_DB_URL:jdbc:postgresql://localhost:5432/addressbook}
spring.datasource.username=${ADDRESSBOOK_DB_USER:addressbook}
spring.datasource.password=${ADDRESSBOOK_DB_PASSWORD:local-course-password}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=10

# Schema creation is an explicit lab step, never an automatic reset on startup.
spring.sql.init.mode=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
